name: Bug
description: Algo que deveria funcionar e não funciona
title: "[bug] descrição curta"
labels: ["dev"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Inclua a mensagem de erro (sem segredos e sem dados pessoais).
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      value: |
        1.
        2.
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: "ex.: Windows 11 + Docker Desktop 4.x, branch main"
