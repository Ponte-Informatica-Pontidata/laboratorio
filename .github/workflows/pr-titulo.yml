name: Título do PR

# O título do PR vira a mensagem do commit no squash merge, por isso ele segue Conventional Commits.
# Exemplos válidos:  feat: normalizar textos do objeto   |   fix(carga): fuso das datas   |   docs: dicionário de itens

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Título em Conventional Commits
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            style
            revert
          requireScope: false
