# Fonte de verdade do calendário do laboratório (lido pelo MCP de gestão).
# Datas de sprint: segunda a sexta. Feriados e semanas de prova reduzem a carga planejada.
laboratorio:
  inicio: 2026-10-26
  fim: 2027-04-09
  horas_semana: 12
  repositorios: [laboratorio, radar-licitacoes]

fases:
  - id: 1
    nome: Base de dados
    assistencia: alta
    descricao: ambiente, criação e carga do banco, SQL, qualidade e limpeza
  - id: 2
    nome: Ingestão real e LGPD
    assistencia: média
    descricao: cliente da API com controle de taxa, validação, LGPD e publicação v0.1
  - id: 3
    nome: IA aplicada
    assistencia: média para baixa
    descricao: embeddings, busca por significado, resumos com LLM e avaliação de qualidade
  - id: 4
    nome: Produto e autonomia
    assistencia: baixa
    descricao: volume e recorte, painel, observabilidade, performance e feature própria
  - id: 5
    nome: Encerramento
    assistencia: autonomia
    descricao: hardening, documentação, demo final e avaliação

semanas:
  - sprint: 0
    inicio: 2026-10-26
    fim: 2026-10-30
    fase: 1
    objetivo: Ambiente rodando, banco criado e carregado com a base real, e primeiro PR aprovado
    temas: [Docker, Git/GitHub, DDL e DML prontos (executora), leitura de arquitetura]
  - sprint: 1
    inicio: 2026-11-03
    fim: 2026-11-06
    fase: 1
    objetivo: Conhecer a base com consultas, um diagnóstico de qualidade e o primeiro tratamento de texto
    temas: [views SQL (sem-ia), perfil de qualidade com pandas, normalização de texto]
    observacoes: segunda 02/11 é Finados (semana de 4 dias)
  - sprint: 2
    inicio: 2026-11-09
    fim: 2026-11-13
    fase: 1
    objetivo: Responder perguntas de negócio com SQL e levar a primeira análise para o app
    temas: [JOINs e funções de janela, índices e EXPLAIN, página de painel no Streamlit]
  - sprint: 3
    inicio: 2026-11-16
    fim: 2026-11-19
    fase: 1
    objetivo: Transformar regras de qualidade em testes e aplicar a limpeza na carga
    temas: [testes de qualidade de dados, limpeza na transformação, migration de correção]
    observacoes: sexta 20/11 é Dia da Consciência Negra
  - sprint: 4
    inicio: 2026-11-23
    fim: 2026-11-27
    fase: 2
    objetivo: Cliente do PNCP que respeita o limite da API (429, backoff, Retry-After)
    temas: [HTTP, paginação, backoff exponencial, testes com MockTransport]
  - sprint: 5
    inicio: 2026-11-30
    fim: 2026-12-04
    fase: 2
    objetivo: Validar os resultados da API e registrar cada execução da ingestão
    temas: [filtros ignorados pela API, radar.execucao_ingestao, métricas de qualidade]
    observacoes: possível semana de provas — confirmar calendário e reduzir a carga
  - sprint: 6
    inicio: 2026-12-07
    fim: 2026-12-11
    fase: 2
    objetivo: LGPD no pipeline — nenhum dado pessoal identificável chega ao banco
    temas: [CPF e dígito verificador (sem-ia), pseudonimização com HMAC, dados sensíveis]
    observacoes: possível semana de provas — confirmar calendário e reduzir a carga
  - sprint: 7
    inicio: 2026-12-14
    fim: 2026-12-18
    fase: 2
    objetivo: Ingestão incremental agendada e primeira publicação (Supabase + Streamlit Cloud) — v0.1
    temas: [upsert incremental, GitHub Actions agendado, Supabase, deploy do app]
    marco: v0.1 publicada
  - recesso: true
    inicio: 2026-12-21
    fim: 2027-01-01
    observacoes: recesso de fim de ano (Lei 11.788, art. 13) — a confirmar
  - sprint: 8
    inicio: 2027-01-04
    fim: 2027-01-08
    fase: 3
    objetivo: Gerar embeddings das contratações e medir o custo em espaço
    temas: [FastEmbed, halfvec × vector, lote incremental]
  - sprint: 9
    inicio: 2027-01-11
    fim: 2027-01-15
    fase: 3
    objetivo: Busca por significado no app
    temas: [índice HNSW, distância de cosseno, página Buscar]
  - sprint: 10
    inicio: 2027-01-18
    fim: 2027-01-22
    fase: 3
    objetivo: Medir a qualidade da busca e combinar com filtros
    temas: [conjunto de consultas de teste, precision@5, busca híbrida]
  - sprint: 11
    inicio: 2027-01-25
    fim: 2027-01-29
    fase: 3
    objetivo: Resumos com LLM local, com prompt versionado e fallback
    temas: [Ollama, engenharia de prompt, Strategy de resumo]
  - sprint: 12
    inicio: 2027-02-01
    fim: 2027-02-05
    fase: 3
    objetivo: Avaliar resumos com critério (e não no olho)
    temas: [golden set, rubrica de resumo, 2 modelos (tempo × qualidade), alucinação]
  - sprint: 13
    inicio: 2027-02-08
    fim: 2027-02-12
    fase: 3
    objetivo: Resumos em lote no Actions e exibidos no app — v0.2
    temas: [IA em lote, limites de execução, exibição no app]
    observacoes: Carnaval 08 a 10/02 (semana curta)
    marco: v0.2 publicada
  - sprint: 14
    inicio: 2027-02-15
    fim: 2027-02-19
    fase: 4
    objetivo: Caber nos 500 MB com folga — medir, reter e agregar
    temas: [pg_total_relation_size, política de retenção, tabelas agregadas]
  - sprint: 15
    inicio: 2027-02-22
    fim: 2027-02-26
    fase: 4
    objetivo: Painel analítico que responde perguntas reais de mercado
    temas: [KPIs, séries temporais, mapa por município]
  - sprint: 16
    inicio: 2027-03-01
    fim: 2027-03-05
    fase: 4
    objetivo: Ampliar a cobertura (UFs e modalidades) com uma decisão registrada em ADR por ela
    temas: [estimativa de volume, ADR, recorte]
  - sprint: 17
    inicio: 2027-03-08
    fim: 2027-03-12
    fase: 4
    objetivo: Observabilidade — saber quando algo quebra antes de alguém reclamar
    temas: [alertas de falha, relatório semanal automático]
  - sprint: 18
    inicio: 2027-03-15
    fim: 2027-03-19
    fase: 4
    objetivo: Performance das consultas e testes de integração
    temas: [EXPLAIN ANALYZE, índices compostos, testes]
  - sprint: 19
    inicio: 2027-03-22
    fim: 2027-03-25
    fase: 4
    objetivo: Uma feature escolhida e planejada por ela (ela escreve as issues)
    temas: [product thinking, escrita de issues, desafio opcional — portal Next.js na Vercel]
    observacoes: sexta 26/03 é Sexta-feira Santa
  - sprint: 20
    inicio: 2027-03-29
    fim: 2027-04-02
    fase: 5
    objetivo: Hardening, documentação final e relatório técnico — v1.0
    temas: [revisão de dívidas técnicas, docs, relatório]
    marco: v1.0
  - sprint: 21
    inicio: 2027-04-05
    fim: 2027-04-09
    fase: 5
    objetivo: Demo final, avaliação final e retrospectiva do laboratório
    temas: [apresentação, rubrica final, portfólio]
