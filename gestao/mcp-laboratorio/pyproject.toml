[project]
name = "laboratorio-mcp"
version = "0.1.0"
description = "MCP do Laboratório Pontidata: o Claude Code como cérebro da gestão (GitHub como fonte de verdade)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "mcp==2.3.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
laboratorio-mcp = "laboratorio_mcp.servidor:main"
laboratorio-publicar = "laboratorio_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laboratorio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
